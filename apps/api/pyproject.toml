[project]
name = "ownerpilot-api"
version = "1.0.0"
description = "FastAPI analytics and AI orchestration service for OwnerPilot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120.0",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "duckdb>=1.4.2",
    "polars>=1.34.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.12",
    "uvicorn>=0.38.0",
    "httpx>=0.28,<1",
    "celery[redis]>=5.6,<6",
    "pypdf>=6.6,<7",
    "pypdfium2>=5,<6",
    "Pillow>=12,<13",
    "defusedxml>=0.7.1",
    "pycountry>=24.6",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "reportlab>=4.4,<5", "ruff>=0.14"]

[tool.uv.build-backend]
module-name = "api"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires RFQ_TEST_DATABASE_URL disposable PostgreSQL", "ollama: requires RFQ_OLLAMA_MODEL and running Ollama"]

[project.scripts]
api = "api.main:main"
api-data = "api.cli:main"
api-rfq-migrate = "api.rfq.db:migrate"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
